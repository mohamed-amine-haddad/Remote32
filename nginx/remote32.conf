server {
    listen 80;
    server_name _;  # catch-all; change to 'retroboy' or the Pi's IP if needed

    # ── React SPA ──────────────────────────────────────────────────────────────
    # Adjust the path below to wherever the repo lives on the Pi.
    root /home/retroboy69/Remote32/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── FastAPI backend ─────────────────────────────────────────────────────────
    # Strip the /api prefix: /api/auth/login → http://127.0.0.1:8000/auth/login
    location /api/ {
        proxy_pass            http://127.0.0.1:8000/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        client_max_body_size  16m;  # firmware .bin uploads
    }


}
