# Load ST-Link interface driver
source [find interface/stlink-dap.cfg]

# Allow remote connections from your PC
bindto 0.0.0.0

# Reserve 8KB RAM for flash programming
set WORKAREASIZE 0x2000

# Load STM32F4 target config
source [find target/stm32f1x.cfg]

# Serial Number
hla_serial "066DFF535550755187063847"

# Reset behavior
reset_config srst_only srst_nogate

# Updated syntax (replaces deprecated commands)
adapter srst delay 100
adapter srst pulse_width 100

# GDB settings
gdb_report_data_abort enable
gdb_flash_program enable

# Ports specification
gdb_port 3334
telnet_port 4445
tcl_port 6667

# Initialize and halt
init
targets